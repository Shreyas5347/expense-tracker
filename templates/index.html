<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1><span class="header-emoji">💰</span> Expense Tracker</h1>
    <p>Smart financial management for daily use</p>
  </div>

  <!-- Dashboard Stats -->
  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-label">Total Expenses</div>
      <div class="stat-value" id="total-expenses">₹0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Average Expense</div>
      <div class="stat-value" id="avg-expense">₹0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Budget</div>
      <div class="stat-value" id="total-budget">₹0</div>
      <div class="stat-change" id="budget-remaining">Remaining</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Transactions</div>
      <div class="stat-value" id="transaction-count">0</div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="form-section">
    <h2>📅 Filter Dashboard</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Month</label>
        <select id="filter-month">
          <option value="">Current Month</option>
          <option value="1">Jan</option>
          <option value="2">Feb</option>
          <option value="3">Mar</option>
          <option value="4">Apr</option>
          <option value="5">May</option>
          <option value="6">Jun</option>
          <option value="7">Jul</option>
          <option value="8">Aug</option>
          <option value="9">Sep</option>
          <option value="10">Oct</option>
          <option value="11">Nov</option>
          <option value="12">Dec</option>
        </select>
      </div>

      <div class="form-group">
        <label>Year</label>
        <select id="filter-year">
          <option value="">Current Year</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
        </select>
      </div>
    </div>
    <button id="apply-filters">Apply Filters</button>
  </div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="chart-container">
      <h3>📊 Expenses by Category</h3>
      <div class="chart-wrapper">
        <canvas id="categoryPieChart"></canvas>
      </div>
    </div>

    <div class="chart-container">
      <h3>📈 Monthly Trend</h3>
      <div class="chart-wrapper">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-container">
      <h3>💳 Category Breakdown</h3>
      <div class="chart-wrapper">
        <canvas id="categoryBarChart"></canvas>
      </div>
    </div>

    <div class="chart-container">
      <h3>🎯 Budget vs Actual</h3>
      <div class="chart-wrapper">
        <canvas id="budgetComparisonChart"></canvas>
      </div>
    </div>
  </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
