<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>{{ 'Sign Up' if mode == 'signup' else 'Login' }} - Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            overflow-y: auto;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 50% 50%, #764ba2, #667eea, #0f172a);
            animation: rotate 20s linear infinite;
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg) translate(-10%, -10%);
            }

            50% {
                transform: rotate(180deg) translate(10%, 10%);
            }

            100% {
                transform: rotate(360deg) translate(-10%, -10%);
            }
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: white;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0 0 10px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #e0e7ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            margin: 0;
        }

        #auth-container {
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Clerk specific overrides for transparency */
        .cl-card {
            background: transparent !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <h1>Expense Tracker</h1>
                <p>Master your finances with style</p>
            </div>
            <div id="auth-container">
                <div class="loading" style="color: white; opacity: 0.7;">Loading security...</div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <p style="font-size: 0.9rem; color: rgba(255,255,255,0.6);">
                    {% if mode == 'login' %}
                    New here? <a href="/signup" style="color: #fff; text-decoration: underline;">Sign up</a>
                    {% else %}
                    Already have an account? <a href="/login" style="color: #fff; text-decoration: underline;">Login</a>
                    {% endif %}
                </p>
            </div>
        </div>
    </div>
    <script 
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="{{ clerk_publishable_key }}"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        onload="initClerkAuth()"
    ></script>
    <!-- ✅ Load Clerk SDK Dynamically -->
    <script>
        console.log("📦 [AUTH] Loading Clerk SDK dynamically...");
        const clerkScript = document.createElement('script');
        clerkScript.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
        clerkScript.crossOrigin = 'anonymous';
        clerkScript.onload = () => {
            console.log("✅ [AUTH] Clerk SDK loaded successfully");
            initClerkAuth();
        };
        clerkScript.onerror = () => {
            console.error("❌ [AUTH] Failed to load Clerk SDK");
        };
        document.body.appendChild(clerkScript);

        async function initClerkAuth() {
            console.log("🔍 [AUTH] Starting Clerk initialization...");
            
            // Wait for Clerk to be available
            let attempts = 0;
            while (!window.Clerk && attempts < 100) {
                console.log(`⏳ [AUTH] Waiting for Clerk... (attempt ${attempts + 1})`);
                await new Promise(res => setTimeout(res, 100));
                attempts++;
            }

            if (!window.Clerk) {
                console.error("❌ [AUTH] Clerk SDK not available");
                document.getElementById('auth-container').innerHTML = 
                    '<p style="color: #ff6b6b;">Failed to load authentication. Please refresh.</p>';
                return;
            }

            try {
                await Clerk.load({
                    publishableKey: window.clerkPublishableKey,
                });

                console.log("✅ [AUTH] Clerk loaded successfully");
                const authContainer = document.getElementById('auth-container');
                authContainer.innerHTML = '';

                if (Clerk.user) {
                    window.location.href = '/';
                    return;
                }

                const mode = "{{ mode }}";
                const config = {
                    appearance: {
                        variables: {
                            colorPrimary: '#667eea',
                            colorText: '#ffffff',
                            colorBackground: 'transparent',
                            colorInputBackground: 'rgba(255,255,255,0.1)',
                            colorInputText: '#ffffff'
                        },
                        elements: {
                            card: { boxShadow: 'none', background: 'transparent' },
                            headerTitle: { color: 'white' },
                            headerSubtitle: { color: 'rgba(255,255,255,0.8)' },
                            socialButtonsBlockButton: {
                                background: 'rgba(255,255,255,0.1)',
                                color: 'white',
                                border: '1px solid rgba(255,255,255,0.2)'
                            },
                            dividerLine: { background: 'rgba(255,255,255,0.2)' },
                            dividerText: { color: 'rgba(255,255,255,0.6)' },
                            formFieldLabel: { color: 'white' },
                            footer: { display: 'none' }
                        }
                    },
                    forceRedirectUrl: '/',
                    fallbackRedirectUrl: '/'
                };

                if (mode === 'signup') {
                    Clerk.mountSignUp(authContainer, config);
                } else {
                    Clerk.mountSignIn(authContainer, config);
                }
            } catch (err) {
                console.error('❌ [AUTH] Clerk load failed:', err);
                document.getElementById('auth-container').innerHTML = 
                    '<p style="color: #ff6b6b;">Error loading authentication. Please refresh.</p>';
            }
        }
    </script>
</body>

</html>
