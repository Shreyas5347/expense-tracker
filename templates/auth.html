<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker – Auth</title>

    <link rel="icon" href="/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            overflow-y: auto;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 50% 50%, #764ba2, #667eea, #0f172a);
            animation: rotate 20s linear infinite;
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg) translate(-10%, -10%);
            }

            50% {
                transform: rotate(180deg) translate(10%, 10%);
            }

            100% {
                transform: rotate(360deg) translate(-10%, -10%);
            }
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            z-index: 10;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            color: white;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0 0 10px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #e0e7ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            margin: 0;
        }

        .loading {
            color: white;
            opacity: 0.7;
            text-align: center;
        }

        .loading.hidden {
            display: none;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .footer-text a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <h1>Expense Tracker</h1>
                <p>Master your finances with style</p>
            </div>

            <div id="auth-container">
                <div class="loading" id="loading-indicator">Loading authentication...</div>
            </div>

            <div class="footer-text" id="toggle-text"></div>
        </div>
    </div>

    <!-- Clerk -->
    <script async crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_c3dlZXQtamFja2FsLTMxLmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js">
        </script>

    <script>
        async function initClerkAuth() {
            while (!window.Clerk) {
                await new Promise(r => setTimeout(r, 100));
            }

            await Clerk.load();

            if (Clerk.user) {
                window.location.href = "/";
                return;
            }

            const isSignup = window.location.pathname.includes("signup");

            document.getElementById("toggle-text").innerHTML = isSignup
                ? `Already have an account? <a href="/login">Login</a>`
                : `New here? <a href="/signup">Sign up</a>`;

            const config = {
                appearance: {
                    variables: {
                        colorPrimary: '#667eea',
                        colorText: '#ffffff',
                        colorBackground: 'transparent',
                        colorInputBackground: 'rgba(255,255,255,0.1)',
                        colorInputText: '#ffffff'
                    },
                    elements: {
                        card: { boxShadow: 'none', background: 'transparent' },
                        footer: { display: 'none' }
                    }
                },
                afterSignInUrl: "/",
                afterSignUpUrl: "/",
                signInUrl: "/login",
                signUpUrl: "/signup"
            };

            document.getElementById("loading-indicator").classList.add("hidden");

            if (isSignup) {
                Clerk.mountSignUp(document.getElementById("auth-container"), config);
            } else {
                Clerk.mountSignIn(document.getElementById("auth-container"), config);
            }
        }

        initClerkAuth();
    </script>
</body>

</html>
